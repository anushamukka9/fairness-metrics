[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-metrics"
version = "0.1.0"
description = "Fairness metrics library: demographic parity, equalized odds, disparate impact, calibration-by-group, threshold scanning, CLI reports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anusha Mukka", email = "hello@anushamukka.com" }]
maintainers = [{ name = "Anusha Mukka" }]
keywords = ["fairness", "machine-learning", "bias", "metrics", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/fairness-metrics"

[project.scripts]
fairness-metrics = "fairness_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
